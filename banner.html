<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BECOMING YOU ✦ FITNESS</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0c0c0d;color:#f2efe9;font-family:Inter,sans-serif}
.bg{position:absolute;inset:0;background-size:cover;background-position:var(--pos,70% 30%)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#0c0c0d 0%,rgba(12,12,13,.92) 30%,rgba(12,12,13,.35) 62%,rgba(12,12,13,.15) 100%),linear-gradient(0deg,rgba(12,12,13,.6),transparent 40%)}
.plain .shade{background:linear-gradient(0deg,rgba(12,12,13,.75),transparent 45%)}
.c{position:absolute;left:6vw;top:50%;transform:translateY(-50%);width:52vw}
.logo{font-family:Archivo;font-stretch:80%;font-weight:800;letter-spacing:.16em;font-size:2.2vh;margin-bottom:5vh}
.logo i{color:#c9a87a;font-style:normal}
.eb{font-weight:600;font-size:1.7vh;letter-spacing:.28em;text-transform:uppercase;color:#c9a87a;margin-bottom:2.4vh;display:flex;align-items:center;gap:1.4vh}
.eb:before{content:"";width:5vh;height:1px;background:#c9a87a}
h1{font-family:Archivo;font-stretch:70%;font-weight:850;text-transform:uppercase;line-height:.92;font-size:10.5vh;letter-spacing:-.005em}
h1 span{color:#a8a29a}
p{margin-top:3.4vh;font-size:2.4vh;line-height:1.5;color:#d6d1c9;max-width:38vw}
.meta{margin-top:5vh;display:flex;gap:4vh;font-size:1.6vh;color:#a8a29a;letter-spacing:.06em;border-top:1px solid rgba(242,239,233,.18);padding-top:2.4vh}
.meta b{display:block;font-family:Archivo;font-stretch:75%;font-size:2.8vh;color:#f2efe9;text-transform:uppercase;letter-spacing:.02em}
.url{position:absolute;right:4vw;bottom:5vh;font-size:1.7vh;letter-spacing:.14em;color:#d6d1c9;text-transform:uppercase}
.tag{position:absolute;left:4vw;bottom:5vh;font-size:1.6vh;letter-spacing:.2em;text-transform:uppercase;color:#d9d4cc}
</style>
</head>
<body>
<div class="bg" id="bg"></div><div class="shade"></div>
<div class="c" id="c"></div>
<div class="url">becomingyoufitness.github.io</div>
<script>
var q=new URLSearchParams(location.search),lang=q.get('lang')||'en',img=q.get('img')||'gym-pose',plain=q.get('plain');
var T={
en:{eb:'Personal fitness coaching',h:'Build your body.<br>Build your standards.<br><span>Become who you said you would be.</span>',p:'Structured training, weekly check-ins and honest accountability for beginners and people starting again.',m:[['7 years','of my own training'],['Weekly','check-ins'],['Free','20-min clarity call']],t:'George · Founder'},
ro:{eb:'Coaching personal de fitness',h:'Construiește-ți corpul.<br>Ridică-ți standardele.<br><span>Devino cine ai spus că vei fi.</span>',p:'Antrenament structurat, verificări săptămânale și responsabilitate sinceră, pentru începători și pentru cei care o iau de la capăt.',m:[['7 ani','de antrenament propriu'],['Săptămânal','verificări'],['Gratuit','apel de 20 de minute']],t:'George · Fondator'},
hu:{eb:'Személyes fitnesz coaching',h:'Építsd a tested.<br>Emeld a mércéd.<br><span>Válj azzá, akivé lenni akartál.</span>',p:'Strukturált edzés, heti visszajelzés és őszinte elszámoltathatóság kezdőknek és újrakezdőknek.',m:[['7 év','saját edzés'],['Heti','visszajelzés'],['Ingyenes','20 perces hívás']],t:'George · Alapító'}
}[lang];
document.getElementById('bg').style.backgroundImage='url(media/'+img+'.jpg)';
if(q.get('pos'))document.getElementById('bg').style.setProperty('--pos',q.get('pos'));
if(plain){document.body.classList.add('plain');document.getElementById('c').remove();var t=document.createElement('div');t.className='tag';t.textContent='BECOMING YOU ✦ FITNESS · '+T.t;document.body.appendChild(t)}
else document.getElementById('c').innerHTML='<div class="logo">BECOMING YOU <i>✦</i> FITNESS</div><div class="eb">'+T.eb+'</div><h1>'+T.h+'</h1><p>'+T.p+'</p><div class="meta">'+T.m.map(function(x){return '<div><b>'+x[0]+'</b>'+x[1]+'</div>'}).join('')+'</div>';
</script>
</body>
</html>
