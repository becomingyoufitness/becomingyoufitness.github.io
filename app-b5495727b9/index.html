.logo i{color:var(--acc);font-style:normal}

.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn.p{background:var(--acc);color:var(--ink)}
.btn.g{background:transparent;border-color:var(--line);color:var(--text)}
.btn.sm{min-height:40px;font-size:.72rem;width:auto;padding:0 14px}
.btn:disabled{opacity:.45}
h1.d{font-size:2.3rem;margin:.4rem 0 .6rem}
h2.d{font-size:1.5rem;margin-bottom:.6rem}
h3{font-size:1rem;font-weight:700}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg3);border-radius:12px;padding:12px 14px;border:1px solid transparent;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--line)}
.item small{display:block;color:var(--muted);font-size:.78rem}
.tag{font:600 .64rem/1 Inter;letter-spacing:.1em;text-transform:uppercase;padding:.35rem .5rem;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.a{color:var(--acc);border-color:rgba(201,168,122,.45)}

.modal.on{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px 18px calc(24px + var(--safe-b))}
.sheet .grab{width:44px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.chart{width:100%;height:160px}
.seg{display:flex;background:var(--bg3);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--text)}
.art p{color:#d6d1c9;margin-bottom:10px}
.art h3{margin:14px 0 6px}
.note{font-size:.76rem;color:var(--dim);margin-top:10px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.toast{position:fixed;top:calc(14px + var(--safe-t));left:50%;transform:translateX(-50%) translateY(-200%);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:.85rem;transition:transform .3s;z-index:50}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

var $=function(s){return document.querySelector(s)},app=$('#app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1800)}
function kg2u(v){return S.unit==='lb'?Math.round(v*2.20462*2)/2:Math.round(v*2)/2}
function u2kg(v){return S.unit==='lb'?v/2.20462:v}
function wk(){var p=S.profile;if(!p)return 1;return Math.floor((Date.now()-p.start)/(7*864e5))+1}
function isDeload(){return wk()%6===0}
function pick(slot,equip,i){var opts=POOL[slot].filter(function(id){return EX[id].e.indexOf(equip)>-1});if(!opts.length)opts=POOL[slot].filter(function(id){return EX[id].e.indexOf('bw')>-1});return opts[i%opts.length]}
function scheme(id){var p=S.profile,x=EX[id],big=['squat','hinge','hpush','vpush','hpull','vpull'].indexOf(x.s)>-1;
 var sets=p.level==='new'?(big?3:2):(big?4:3);if(isDeload())sets=Math.max(2,sets-1);
 if(x.t==='t')return{sets:sets,lo:20,hi:45,unit:'s',rest:60};
 var lo,hi;if(p.goal==='strength'&&big&&x.t==='w'){lo=5;hi=8}else if(p.goal==='lose'||p.goal==='fit'){lo=10;hi=15}else{lo=8;hi=12}
 if(x.t==='b'){lo=Math.max(lo,8);hi=Math.max(hi,15)}
 return{sets:sets,lo:lo,hi:hi,unit:'reps',rest:big?120:75}}
function program(){var p=S.profile,t=DAYS[p.days];return t.map(function(d,di){return{name:d[0],ex:d[1].map(function(slot,k){return pick(slot,p.equip,di+k)})}})}
function nextDayIndex(){var n=S.logs.length;return n%S.profile.days}
function todaysPlanned(){return SCHED[S.profile.days].indexOf(new Date().getDay())>-1}
function suggestion(id){var x=EX[id],sc=scheme(id),L=S.last[id];
 if(!L)return{w:null,r:sc.lo,msg:x.t==='w'?'First time: pick a weight you could lift for '+(sc.hi+2)+' clean reps.':'Aim for '+sc.lo+'–'+sc.hi+' '+sc.unit+' with clean form.'};
 var all=L.sets.length&&L.sets.every(function(s){return s.r>=sc.hi}),low=L.sets.some(function(s){return s.r<sc.lo});
 var w=L.w;
 if(x.t==='w'){if(isDeload())return{w:Math.round(w*0.85*2)/2,r:sc.lo,msg:'Deload week: lighter weight, easy reps. Recovery is training too.'};
  if(all){var inc=x.up?2.5:5;if(w<20)inc=x.up?1:2.5;return{w:w+inc,r:sc.lo,msg:'You hit '+sc.hi+' reps on every set last time. Weight goes up: +'+kg2u(inc)+' '+S.unit+'.'}}
  if(low)return{w:w,r:sc.lo,msg:'Last time some sets fell under '+sc.lo+'. Same weight; own it before adding more.'};
  return{w:w,r:Math.min(sc.hi,Math.max.apply(null,L.sets.map(function(s){return s.r}))+1),msg:'Same weight; try to add one rep per set.'}}
 var best=Math.max.apply(null,L.sets.map(function(s){return s.r}));
 if(all)return{w:null,r:sc.hi,msg:'You maxed the range. Make it harder: slower lowering, a pause, or a harder variation.'};
 return{w:null,r:Math.min(sc.hi,best+1),msg:'Beat last time: aim for '+Math.min(sc.hi,best+1)+' '+sc.unit+'.'}}

/* =================== ROUTER =================== */
var tab='today';
function go(t){tab=t;render();window.scrollTo(0,0)}
document.querySelectorAll('nav.tabs button').forEach(function(b){b.onclick=function(){go(b.dataset.t)}});
function render(){
 if(!S.profile){$('#tabs').hidden=true;return onboarding()}
 if(S.cur){$('#tabs').hidden=true;return workout()}
 $('#tabs').hidden=false;
 document.querySelectorAll('nav.tabs button').forEach(function(b){b.setAttribute('aria-current',b.dataset.t===tab)});
 ({today:today,program:train,progress:progress,fuel:fuel,learn:learn})[tab]();
}
function top(title,right){return '<header class="top"><span class="logo">BECOMING YOU <i>✦</i> FITNESS</span>'+(right||'')+'</header>'+(title?'<p class="ey">'+title+'</p>':'')}

 {k:'days',t:'How many days a week, realistically?',o:[[2,'2 days','Minimum effective dose'],[3,'3 days','The sweet spot for most'],[4,'4 days','More volume, upper/lower split'],[5,'5 days','For people with time and recovery']]},

 var q=Q[ob.i],pct=Math.round(ob.i/Q.length*100),h=top('Step '+(ob.i+1)+' of '+Q.length)+'<div class="progress"><i style="width:'+pct+'%"></i></div>';

 else if(q.form){var a=ob.a;h+='<div class="seg" style="margin:14px 0"><button data-u="kg" aria-pressed="'+(S.unit==='kg')+'">kg · cm</button><button data-u="lb" aria-pressed="'+(S.unit==='lb')+'">lb · ft/in</button></div>'+
  '<div class="grid2"><div><label class="f" for="sex">Sex</label><select class="in" id="sex"><option value="m">Male</option><option value="f"'+(a.sex==='f'?' selected':'')+'>Female</option></select></div><div><label class="f" for="age">Age</label><input class="in" id="age" type="number" inputmode="numeric" min="18" max="90" value="'+(a.age||'')+'"></div>'+
  '<div><label class="f" for="wt">Weight ('+S.unit+')</label><input class="in" id="wt" type="number" inputmode="decimal" value="'+(a.wt?kg2u(a.wt):'')+'"></div><div><label class="f" for="ht">Height (cm)</label><input class="in" id="ht" type="number" inputmode="numeric" value="'+(a.ht||'')+'"></div></div>'+
  '<label class="f" for="act" style="margin-top:12px">Daily activity outside training</label><select class="in" id="act"><option value="1.35">Mostly sitting</option><option value="1.5" selected>On my feet some of the day</option><option value="1.65">On my feet most of the day</option></select>'+
  '<p class="note">Used only to estimate calories and protein. You must be 18 or older to use this app.</p><button class="btn p" id="next" style="margin-top:18px">Continue</button>'}
 else if(q.safe){h+='<div class="card"><p class="muted" style="margin-bottom:12px">Please talk to a doctor before starting if any of these apply to you:</p><ul class="muted" style="padding-left:18px;display:grid;gap:6px;font-size:.9rem"><li>A heart condition, or you\'ve been told to exercise only under medical supervision</li><li>Chest pain during activity or at rest</li><li>Dizziness or fainting</li><li>A bone, joint or back problem that gets worse with exercise</li><li>Medication for blood pressure or a heart condition</li><li>Pregnancy or giving birth in the last 6 months</li></ul></div>'+
  '<label class="row" style="gap:12px;margin:14px 0;cursor:pointer"><input type="checkbox" id="ok18" style="width:22px;height:22px;accent-color:var(--acc)"> <span class="muted">I\'m 18+, none of the above apply (or my doctor has cleared me), and I understand this app gives general fitness guidance, not medical advice.</span></label><button class="btn p" id="finish">Build my program</button>'}
 if(ob.i>0)h+='<button class="btn g" id="back" style="margin-top:10px">Back</button>';
 app.innerHTML=h;
 app.querySelectorAll('.opt button').forEach(function(b){b.onclick=function(){var v=b.dataset.v;ob.a[q.k]=isNaN(v)?v:+v;ob.i++;render()}});
 app.querySelectorAll('[data-u]').forEach(function(b){b.onclick=function(){var w=$('#wt').value;if(w)ob.a.wt=u2kg(+w);S.unit=b.dataset.u;render()}});
 var bk=$('#back');if(bk)bk.onclick=function(){ob.i--;render()};
 var nx=$('#next');if(nx)nx.onclick=function(){var age=+$('#age').value,wt=+$('#wt').value,ht=+$('#ht').value;if(age<18||age>90||!wt||!ht||ht<120||ht>230){toast('Check age (18+), weight and height');return}ob.a.sex=$('#sex').value;ob.a.age=age;ob.a.wt=u2kg(wt);ob.a.ht=ht;ob.a.act=+$('#act').value;ob.i++;render()};
 var fi=$('#finish');if(fi)fi.onclick=function(){if(!$('#ok18').checked){toast('Please confirm to continue');return}S.profile=Object.assign({},ob.a,{start:Date.now()});S.weights.push({d:dayKey(),w:ob.a.wt});save();tab='today';toast('Your program is ready');render()};
}

/* =================== TODAY =================== */
function today(){
 var p=S.profile,prog=program(),di=nextDayIndex(),d=prog[di],k=dayKey(),hb=S.habits[k]||{},done=HABITS.filter(function(h){return hb[h[0]]}).length;
 var weekStart=new Date();weekStart.setDate(weekStart.getDate()-weekStart.getDay());var sessionsThisWeek=S.logs.filter(function(l){return new Date(l.d)>=new Date(dayKey(weekStart))}).length;
 var streak=0;for(var i=0;i<365;i++){var dd=new Date();dd.setDate(dd.getDate()-i);var h=S.habits[dayKey(dd)];if(h&&Object.keys(h).filter(function(x){return h[x]}).length>=3)streak++;else if(i>0)break}
 var wkd=['S','M','T','W','T','F','S'],cells='';for(var j=0;j<7;j++){var c=new Date(weekStart);c.setDate(c.getDate()+j);var ck=dayKey(c),dn=S.logs.some(function(l){return l.d===ck}),pl=SCHED[p.days].indexOf(j)>-1;cells+='<div><i class="'+(dn?'done ':'')+(pl&&!dn?'plan ':'')+(ck===k?'today':'')+'"></i>'+wkd[j]+'</div>'}
 var ci=needsCheckin();
 app.innerHTML=top('Week '+wk()+(isDeload()?' · deload':''),'<button class="chipbtn" id="settings">Settings</button>')+
  '<h1 class="d">'+(todaysPlanned()?'Today: '+esc(d.name):'Rest or walk day')+'</h1>'+
  '<div class="card hero"><div class="row between"><div><p class="ey">Next session</p><h2 class="d" style="margin:.5rem 0 .3rem">'+esc(d.name)+'</h2><p class="muted" style="font-size:.88rem">'+d.ex.length+' exercises · about '+(d.ex.length*9)+' min</p></div><span class="tag a">'+(p.equip==='gym'?'Gym':p.equip==='db'?'Dumbbells':'Bodyweight')+'</span></div>'+
  '<div class="list" style="margin:14px 0">'+d.ex.map(function(id){var sc=scheme(id);return '<div class="row between" style="font-size:.9rem"><span>'+esc(EX[id].n)+'</span><span class="dim">'+sc.sets+' × '+sc.lo+'–'+sc.hi+(sc.unit==='s'?'s':'')+'</span></div>'}).join('')+'</div>'+
  '<button class="btn p" id="start">Start workout</button>'+(!todaysPlanned()?'<p class="note">Not a scheduled day. Training anyway is fine; so is a 20–30 minute walk.</p>':'')+'</div>'+
  installCard()+(ci?'<div class="card" style="border-color:rgba(201,168,122,.5)"><div class="row between"><div><p class="ey">Weekly check-in</p><h3 style="margin-top:6px">Your week in review is ready</h3></div><button class="btn p sm" id="ci">Open</button></div></div>':'')+
  '<div class="card"><div class="row between"><h3>This week</h3><span class="dim" style="font-size:.85rem">'+sessionsThisWeek+' / '+p.days+' sessions</span></div><div class="week">'+cells+'</div></div>'+
  '<div class="card"><div class="row between" style="margin-bottom:4px"><h3>Daily habits</h3><span class="tag '+(streak?'a':'')+'">'+streak+' day streak</span></div><p class="dim" style="font-size:.8rem">3 of 5 keeps your streak alive.</p>'+
  HABITS.map(function(h){return '<div class="habit" role="checkbox" tabindex="0" data-h="'+h[0]+'" aria-checked="'+!!hb[h[0]]+'"><span class="box">'+(hb[h[0]]?'✓':'')+'</span><span>'+h[1]+'</span></div>'}).join('')+'</div>';
 $('#start').onclick=function(){startWorkout(di)};wireInstall();
 $('#settings').onclick=settings;
 var c2=$('#ci');if(c2)c2.onclick=checkin;
 app.querySelectorAll('.habit').forEach(function(e){var f=function(){var h=S.habits[k]=S.habits[k]||{};h[e.dataset.h]=!h[e.dataset.h];save();today();if(Object.keys(h).filter(function(x){return h[x]}).length===HABITS.length)toast('All 5 today. That\'s how it\'s done.')};e.onclick=f;e.onkeydown=function(ev){if(ev.key===' '||ev.key==='Enter'){ev.preventDefault();f()}}});

/* =================== WORKOUT =================== */
function startWorkout(di){var d=program()[di];S.cur={di:di,name:d.name,t0:Date.now(),ex:d.ex.map(function(id){var sc=scheme(id),sg=suggestion(id);return{id:id,sets:Array.from({length:sc.sets},function(){return{w:sg.w,r:null,ok:false}})}})};save();render()}
function workout(){
 var c=S.cur;
 var h='<header class="top"><button class="chipbtn" id="quit">✕ End</button><span class="ey">'+esc(c.name)+'</span><span class="dim" id="clock" style="font-size:.85rem"></span></header>';
 h+=c.ex.map(function(e,ei){var x=EX[e.id],sc=scheme(e.id),sg=suggestion(e.id),L=S.last[e.id];
  return '<div class="card"><div class="row between"><div><h3>'+esc(x.n)+'</h3><small class="muted">'+esc(x.m)+' · '+sc.sets+' × '+sc.lo+'–'+sc.hi+' '+sc.unit+' · rest '+sc.rest+'s</small></div><button class="chipbtn" data-info="'+e.id+'">How</button></div>'+
  '<div class="hint">'+esc(sg.msg)+(L?'<br><span class="dim">Last: '+L.sets.map(function(s){return (x.t==='w'?kg2u(L.w)+'×':'')+s.r}).join(', ')+'</span>':'')+'</div>'+
  '<div class="sethead"><span>Set</span><span>'+(x.t==='w'?S.unit:'—')+'</span><span>'+(sc.unit==='s'?'Seconds':'Reps')+'</span><span>✓</span></div>'+
  e.sets.map(function(s,si){return '<div class="set"><span class="n">'+(si+1)+'</span>'+(x.t==='w'?'<input inputmode="decimal" type="number" step="0.5" aria-label="Weight set '+(si+1)+'" data-e="'+ei+'" data-s="'+si+'" data-k="w" value="'+(s.w!=null?kg2u(s.w):'')+'" placeholder="–">':'<span class="dim" style="text-align:center">BW</span>')+
   '<input inputmode="numeric" type="number" aria-label="'+(sc.unit==='s'?'Seconds':'Reps')+' set '+(si+1)+'" data-e="'+ei+'" data-s="'+si+'" data-k="r" value="'+(s.r!=null?s.r:'')+'" placeholder="'+sg.r+'"><button class="chk" aria-label="Complete set '+(si+1)+'" aria-pressed="'+s.ok+'" data-e="'+ei+'" data-s="'+si+'">✓</button></div>'}).join('')+'</div>'}).join('');
 h+='<button class="btn p" id="finishw">Finish workout</button><p class="note" style="text-align:center">Stop any exercise that causes sharp pain, chest pain or dizziness.</p>';
 app.innerHTML=h;
 var tick=function(){var e=$('#clock');if(!e||!S.cur)return;var m=Math.floor((Date.now()-S.cur.t0)/60000);e.textContent=m+' min'};tick();clearInterval(window.__ck);window.__ck=setInterval(tick,30000);
 app.querySelectorAll('.set input').forEach(function(i){i.oninput=function(){var s=S.cur.ex[+i.dataset.e].sets[+i.dataset.s];var v=i.value===''?null:+i.value;if(i.dataset.k==='w')s.w=v==null?null:u2kg(v);else s.r=v;save()}});
 app.querySelectorAll('.chk').forEach(function(b){b.onclick=function(){var e=S.cur.ex[+b.dataset.e],s=e.sets[+b.dataset.s];if(!s.ok&&s.r==null){var sg=suggestion(e.id);s.r=sg.r;}if(!s.ok&&EX[e.id].t==='w'&&!s.w){toast('Enter the weight first');return}s.ok=!s.ok;save();if(s.ok)rest(scheme(e.id).rest);workout()}});
 app.querySelectorAll('[data-info]').forEach(function(b){b.onclick=function(){exInfo(b.dataset.info)}});
 $('#quit').onclick=function(){sheet('<h2 class="d">End workout?</h2><p class="muted" style="margin-bottom:16px">Completed sets will be saved. Unfinished sets won\'t count.</p><button class="btn p" id="sv">Save what I did</button><button class="btn g" id="ds" style="margin-top:8px">Discard workout</button><button class="btn g" id="cn" style="margin-top:8px">Keep going</button>');$('#sv').onclick=function(){closeSheet();finish()};$('#ds').onclick=function(){closeSheet();S.cur=null;save();stopRest();render()};$('#cn').onclick=closeSheet};
 $('#finishw').onclick=finish;
}
function finish(){var c=S.cur,sum=0,prs=[];var log={d:dayKey(),name:c.name,min:Math.max(1,Math.round((Date.now()-c.t0)/60000)),ex:[]};
 c.ex.forEach(function(e){var done=e.sets.filter(function(s){return s.ok&&s.r});if(!done.length)return;var x=EX[e.id];var w=x.t==='w'?Math.max.apply(null,done.map(function(s){return s.w||0})):0;
  var prev=S.last[e.id],best=(prev&&prev.best)||0,e1=x.t==='w'?Math.max.apply(null,done.map(function(s){return (s.w||0)*(1+s.r/30)})):Math.max.apply(null,done.map(function(s){return s.r}));
  if(prev&&e1>best*1.001)prs.push(x.n);
  S.last[e.id]={w:w,sets:done.map(function(s){return{r:s.r}}),d:log.d,best:Math.max(best,e1)};
  done.forEach(function(s){sum+=(s.w||0)*s.r});log.ex.push({id:e.id,w:w,sets:done.map(function(s){return{w:s.w,r:s.r}})})});
 if(!log.ex.length){toast('No completed sets to save');return}
 log.vol=Math.round(sum);S.logs.push(log);var hb=S.habits[log.d]=S.habits[log.d]||{};hb.train=true;S.cur=null;stopRest();save();tab='today';render();
 sheet('<p class="ey">Session complete</p><h2 class="d" style="margin:.5rem 0">'+esc(log.name)+' ✦ done</h2><div class="grid3" style="margin:14px 0"><div class="stat"><b>'+log.min+'</b><span>Minutes</span></div><div class="stat"><b>'+log.ex.length+'</b><span>Exercises</span></div><div class="stat"><b>'+(log.vol?Math.round(kg2u(log.vol)/100)/10+'k':'—')+'</b><span>'+S.unit+' lifted</span></div></div>'+(prs.length?'<div class="hint">New best: '+prs.map(esc).join(', ')+'</div>':'<p class="muted">Logged. Your next session adjusts automatically from today\'s numbers.</p>')+'<button class="btn p" id="ok" style="margin-top:12px">Done</button>');$('#ok').onclick=closeSheet}
var rt=null,rleft=0;
function rest(sec){rleft=sec;$('#timer').classList.add('on');$('#tleft').textContent=rleft;clearInterval(rt);rt=setInterval(function(){rleft--;$('#tleft').textContent=Math.max(0,rleft);if(rleft<=0){stopRest();toast('Rest done. Next set.');try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}},1000)}
function stopRest(){clearInterval(rt);$('#timer').classList.remove('on')}
$('#tplus').onclick=function(){rleft+=30;$('#tleft').textContent=rleft};$('#tskip').onclick=stopRest;

 app.innerHTML=top('Your program')+'<h1 class="d">'+({muscle:'Build muscle',lose:'Lean & strong',strength:'Strength',fit:'Foundations'})[p.goal]+' · '+p.days+' days</h1>'+
 '<p class="muted" style="margin-bottom:16px">Week '+wk()+'. Every 6th week is a lighter deload week. Weights adjust automatically from what you log.</p>'+
 prog.map(function(d,i){return '<div class="card"><div class="row between"><div><p class="ey">'+wd[SCHED[p.days][i]]+(i===di?' · next':'')+'</p><h3 style="margin-top:6px">'+esc(d.name)+'</h3></div><button class="btn '+(i===di?'p':'g')+' sm" data-go="'+i+'">Start</button></div><div class="list" style="margin-top:12px">'+d.ex.map(function(id){var sc=scheme(id);return '<button class="item" data-info="'+id+'"><span>'+esc(EX[id].n)+'<small>'+esc(EX[id].m)+'</small></span><span class="dim" style="font-size:.85rem">'+sc.sets+'×'+sc.lo+'–'+sc.hi+'</span></button>'}).join('')+'</div></div>'}).join('')+
 '<h2 class="d" style="margin-top:22px">Exercise library</h2><div class="list">'+Object.keys(EX).filter(function(id){return EX[id].e.indexOf(p.equip)>-1}).map(function(id){return '<button class="item" data-info="'+id+'"><span>'+esc(EX[id].n)+'<small>'+esc(EX[id].m)+'</small></span><span class="tag">'+EX[id].s.replace('hpush','push').replace('vpush','press').replace('hpull','row').replace('vpull','pull')+'</span></button>'}).join('')+'</div>'+
 '<button class="btn g" id="redo" style="margin-top:18px">Change goal, days or equipment</button>';

 $('#redo').onclick=function(){ob={i:0,a:Object.assign({},S.profile)};S.profile=null;save();render()};
}
function exInfo(id){var x=EX[id],L=S.last[id];sheet('<p class="ey">'+esc(x.m)+'</p><h2 class="d" style="margin:.5rem 0 1rem">'+esc(x.n)+'</h2><h3 style="margin-bottom:8px">Form cues</h3><ol style="padding-left:18px;display:grid;gap:6px;color:#d6d1c9">'+x.c.map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ol>'+(L?'<div class="hint" style="margin-top:14px">Last logged '+L.d+': '+(x.t==='w'?kg2u(L.w)+' '+S.unit+' × ':'')+L.sets.map(function(s){return s.r}).join(', ')+'</div>':'')+'<p class="note">Stop if you feel sharp or joint pain. Use a lighter weight or an easier variation.</p><button class="btn g" id="cl" style="margin-top:14px">Close</button>');$('#cl').onclick=closeSheet}

/* =================== PROGRESS =================== */
function progress(){
 var logs=S.logs,total=logs.length,mins=logs.reduce(function(a,l){return a+l.min},0),vol=logs.reduce(function(a,l){return a+(l.vol||0)},0);
 var weeks=[];for(var i=7;i>=0;i--){var s=new Date();s.setDate(s.getDate()-s.getDay()-i*7);var e=new Date(s);e.setDate(e.getDate()+7);weeks.push({l:(s.getMonth()+1)+'/'+s.getDate(),n:logs.filter(function(l){var d=new Date(l.d);return d>=new Date(dayKey(s))&&d<new Date(dayKey(e))}).length})}
 var maxN=Math.max(S.profile.days,1),bars=weeks.map(function(w,i){var h=Math.round(w.n/maxN*110);return '<g><rect x="'+(i*40+8)+'" y="'+(125-h)+'" width="24" height="'+Math.max(h,2)+'" rx="5" fill="'+(w.n>=S.profile.days?'#c9a87a':'#4a4540')+'"/><text x="'+(i*40+20)+'" y="145" text-anchor="middle" font-size="10" fill="#76716b">'+w.l+'</text></g>'}).join('');
 var W=S.weights.slice(-20),wchart='';if(W.length>1){var mn=Math.min.apply(null,W.map(function(x){return x.w})),mx=Math.max.apply(null,W.map(function(x){return x.w}));if(mx-mn<2){mx+=1;mn-=1}var pts=W.map(function(x,i){return (10+i*(300/(W.length-1))).toFixed(1)+','+(120-(x.w-mn)/(mx-mn)*100).toFixed(1)}).join(' ');wchart='<svg class="chart" viewBox="0 0 320 150" role="img" aria-label="Bodyweight trend"><polyline points="'+pts+'" fill="none" stroke="#c9a87a" stroke-width="2.5" stroke-linejoin="round"/><text x="10" y="145" font-size="10" fill="#76716b">'+W[0].d+'</text><text x="310" y="145" font-size="10" fill="#76716b" text-anchor="end">'+W[W.length-1].d+'</text><text x="310" y="14" font-size="11" fill="#f2efe9" text-anchor="end">'+kg2u(W[W.length-1].w)+' '+S.unit+'</text></svg>'}
 var bests=Object.keys(S.last).filter(function(id){return EX[id]}).map(function(id){var L=S.last[id],x=EX[id];return '<div class="item" style="cursor:default"><span>'+esc(x.n)+'<small>Last: '+L.d+'</small></span><b>'+(x.t==='w'?kg2u(L.w)+' '+S.unit+' × '+Math.max.apply(null,L.sets.map(function(s){return s.r})):Math.max.apply(null,L.sets.map(function(s){return s.r}))+(x.t==='t'?'s':' reps'))+'</b></div>'}).join('');
 app.innerHTML=top('Progress')+'<h1 class="d">Proof, not promises.</h1>'+
 '<div class="grid3" style="margin:14px 0"><div class="stat"><b>'+total+'</b><span>Sessions</span></div><div class="stat"><b>'+Math.round(mins/60*10)/10+'</b><span>Hours</span></div><div class="stat"><b>'+(vol?Math.round(kg2u(vol)/1000)+'k':'0')+'</b><span>'+S.unit+' lifted</span></div></div>'+
 '<div class="card"><h3>Sessions per week</h3><p class="dim" style="font-size:.8rem">Gold = you hit your target of '+S.profile.days+'.</p><svg class="chart" viewBox="0 0 320 150" role="img" aria-label="Sessions per week, last 8 weeks">'+bars+'</svg></div>'+
 '<div class="card"><div class="row between"><h3>Bodyweight</h3><button class="btn g sm" id="addw">Log weight</button></div>'+(wchart||'<p class="empty">Log your weight weekly, same time of day, to see the trend.</p>')+'</div>'+
 '<div class="card"><h3 style="margin-bottom:10px">Your lifts</h3>'+(bests?'<div class="list">'+bests+'</div>':'<p class="empty">Finish your first workout to see your numbers here.</p>')+'</div>'+
 '<div class="card"><h3 style="margin-bottom:10px">History</h3>'+(logs.length?'<div class="list">'+logs.slice().reverse().slice(0,15).map(function(l){return '<div class="item" style="cursor:default"><span>'+esc(l.name)+'<small>'+l.d+' · '+l.min+' min</small></span><span class="dim">'+l.ex.length+' ex</span></div>'}).join('')+'</div>':'<p class="empty">No workouts yet.</p>')+'</div>';
 $('#addw').onclick=function(){sheet('<h2 class="d">Log bodyweight</h2><label class="f" for="nw" style="margin-top:12px">Weight ('+S.unit+')</label><input class="in" id="nw" type="number" inputmode="decimal" step="0.1"><p class="note">Weigh in weekly, same conditions. Daily numbers swing; the trend is what matters.</p><button class="btn p" id="sw" style="margin-top:12px">Save</button><button class="btn g" id="cw" style="margin-top:8px">Cancel</button>');$('#sw').onclick=function(){var v=+$('#nw').value;if(!v){toast('Enter a weight');return}S.weights.push({d:dayKey(),w:u2kg(v)});S.profile.wt=u2kg(v);save();closeSheet();progress()};$('#cw').onclick=closeSheet};
}

/* =================== CHECK-IN =================== */
function needsCheckin(){if(S.logs.length<1)return false;var lastC=S.checkins.length?S.checkins[S.checkins.length-1].d:null;var d=new Date();return d.getDay()===0||d.getDay()===1?lastC!==dayKey():(lastC?(Date.now()-new Date(lastC))>8*864e5:(Date.now()-S.profile.start)>6*864e5)}
function checkin(){var from=new Date();from.setDate(from.getDate()-7);var L=S.logs.filter(function(l){return new Date(l.d)>=from}),n=L.length,t=S.profile.days;
 var hd=0,hdays=0;for(var i=0;i<7;i++){var dd=new Date();dd.setDate(dd.getDate()-i);var h=S.habits[dayKey(dd)];if(h){hdays++;hd+=Object.keys(h).filter(function(x){return h[x]}).length}}var hp=Math.round(hd/35*100);
 var msg,focus;if(n>=t){msg='You hit all '+t+' sessions. That\'s the whole game.';focus=hp<60?'Keep training as is; lift your daily habits, especially sleep and protein.':'Keep it exactly like this. Small weight jumps will keep coming.'}
 else if(n>=t-1){msg=n+' of '+t+' sessions. Close.';focus='Pick the session most likely to get skipped and give it a fixed time in your calendar.'}
 else if(n>0){msg=n+' of '+t+' sessions. Something got in the way, and that\'s data, not failure.';focus=t>2?'Consider dropping to '+(t-1)+' days for two weeks. A plan you complete beats a plan you miss.':'Make the first 10 minutes non-negotiable: warm-up plus first exercise.'}
 else{msg='No sessions this week. Restarting is a skill.';focus='Do one session in the next 48 hours, even a short one. That\'s the only goal.'}
 sheet('<p class="ey">Weekly check-in · week '+wk()+'</p><h2 class="d" style="margin:.5rem 0 1rem">'+msg+'</h2><div class="grid2"><div class="stat"><b>'+n+'/'+t+'</b><span>Sessions</span></div><div class="stat"><b>'+hp+'%</b><span>Habits</span></div></div><div class="hint" style="margin-top:14px"><b>Focus for next week:</b> '+focus+'</div>'+
 '<label class="f" for="en" style="margin-top:14px">How was your energy this week?</label><div class="seg" id="en">'+[1,2,3,4,5].map(function(v){return '<button data-v="'+v+'" aria-pressed="false">'+['Low','','OK','','High'][v-1]+(v===2||v===4?'·':'')+'</button>'}).join('')+'</div>'+
 '<label class="f" for="wtn" style="margin-top:14px">Bodyweight today (optional, '+S.unit+')</label><input class="in" id="wtn" type="number" inputmode="decimal" step="0.1">'+
 '<button class="btn p" id="cs" style="margin-top:16px">Save check-in</button>');
 var en=null;document.querySelectorAll('#en button').forEach(function(b){b.onclick=function(){en=+b.dataset.v;document.querySelectorAll('#en button').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}});
 $('#cs').onclick=function(){var w=+$('#wtn').value;if(w){S.weights.push({d:dayKey(),w:u2kg(w)});S.profile.wt=u2kg(w)}S.checkins.push({d:dayKey(),n:n,hp:hp,en:en});save();closeSheet();toast(en&&en<=2?'Low energy noted. Prioritise sleep this week.':'Check-in saved');render()}}

/* =================== FUEL =================== */
function targets(){var p=S.profile,bmr=10*p.wt+6.25*p.ht-5*p.age+(p.sex==='m'?5:-161),tdee=bmr*(p.act||1.5)+p.days*40;var adj={lose:-0.15,muscle:0.08,strength:0.05,fit:0}[p.goal]||0;var kcal=tdee*(1+adj);var floor=Math.max(bmr*1.1,p.sex==='m'?1600:1300);if(kcal<floor)kcal=floor;return{kcal:Math.round(kcal/10)*10,p:Math.round(p.wt*1.8),tdee:Math.round(tdee/10)*10}}
function fuel(){var t=targets(),g=S.profile.goal;
 app.innerHTML=top('Fuel')+'<h1 class="d">Eat for the goal.</h1><p class="muted" style="margin-bottom:14px">Estimated daily targets based on your body, activity and goal. Use them as a starting point, not a rule.</p>'+
 '<div class="grid2"><div class="stat"><b>'+t.kcal+'</b><span>kcal / day</span></div><div class="stat"><b>'+t.p+' g</b><span>Protein / day</span></div></div>'+
 '<div class="card" style="margin-top:14px"><h3>How to use this</h3><ul class="muted" style="padding-left:18px;margin-top:8px;display:grid;gap:6px;font-size:.9rem"><li>Hit protein most days; it matters most.</li><li>'+(g==='lose'?'Aim to lose about 0.5% of bodyweight per week. Faster usually costs muscle and energy.':g==='muscle'?'Aim to gain about 0.25–0.5% of bodyweight per month.':'Keep bodyweight roughly stable while performance improves.')+'</li><li>Check the weekly trend, not daily numbers, and adjust by ~150 kcal if it stalls for 3 weeks.</li></ul>'+
 '<p class="note">General information, not medical or dietetic advice. If you have a medical condition, are pregnant, or have a history of disordered eating, please work with a doctor or registered dietitian instead of using calorie targets.</p></div>'+
 '<h2 class="d" style="margin-top:22px">Meal ideas</h2><p class="dim" style="font-size:.8rem;margin-bottom:10px">Approximate values per serving.</p><div class="seg" id="mf" style="margin-bottom:12px">'+['All','Breakfast','Lunch','Dinner','Snack'].map(function(c,i){return '<button data-c="'+c+'" aria-pressed="'+(i===0)+'">'+c+'</button>'}).join('')+'</div><div class="list" id="meals"></div>';
 var draw=function(c){$('#meals').innerHTML=MEALS.filter(function(m){return c==='All'||m[1]===c}).map(function(m){return '<div class="item" style="cursor:default"><span>'+esc(m[0])+'<small>'+esc(m[2])+'</small></span><span style="text-align:right;font-size:.82rem"><b>'+m[4]+'g</b> protein<br><span class="dim">~'+m[3]+' kcal</span></span></div>'}).join('')};draw('All');
 document.querySelectorAll('#mf button').forEach(function(b){b.onclick=function(){document.querySelectorAll('#mf button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});draw(b.dataset.c)}});
}

/* =================== LEARN =================== */
function learn(){app.innerHTML=top('Learn')+'<h1 class="d">Know why, not just what.</h1><p class="muted" style="margin-bottom:14px">Short guides. Two minutes each.</p><div class="list">'+ARTS.map(function(a,i){return '<button class="item" data-a="'+i+'"><span>'+esc(a[0])+'<small>2 min read</small></span><span class="tag">'+a[1]+'</span></button>'}).join('')+'</div>';
 app.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){var a=ARTS[+b.dataset.a];sheet('<p class="ey">'+a[1]+'</p><h2 class="d" style="margin:.5rem 0 1rem">'+esc(a[0])+'</h2><div class="art">'+a[2]+'</div><button class="btn g" id="cl" style="margin-top:12px">Close</button>');$('#cl').onclick=closeSheet}})}


/* =================== INSTALL =================== */
var deferredPrompt=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;if(S.profile&&tab==='today'&&!S.cur)render()});
function standalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function installCard(){if(standalone()||S.hideInstall)return '';var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 return '<div class="card" id="inst"><div class="row between"><div><p class="ey">Get the app</p><h3 style="margin-top:6px">Add BECOMING YOU to your home screen</h3></div><button class="chipbtn" id="instx" aria-label="Dismiss">✕</button></div>'+
 (deferredPrompt?'<button class="btn p" id="instb" style="margin-top:12px">Install app</button>':ios?'<p class="muted" style="font-size:.88rem;margin-top:8px">In Safari, tap the <b>Share</b> button, then <b>Add to Home Screen</b>.</p>':'<p class="muted" style="font-size:.88rem;margin-top:8px">Open the browser menu (⋮) and tap <b>Install app</b> or <b>Add to Home screen</b>.</p>')+'</div>'}
function wireInstall(){var b=$('#instb');if(b)b.onclick=function(){deferredPrompt.prompt();deferredPrompt.userChoice.finally(function(){deferredPrompt=null;render()})};var x=$('#instx');if(x)x.onclick=function(){S.hideInstall=true;save();render()}}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){})}

/* =================== SETTINGS & SHEET =================== */
function settings(){var p=S.profile;sheet('<h2 class="d">Settings</h2><label class="f" style="margin-top:14px">Units</label><div class="seg"><button data-u="kg" aria-pressed="'+(S.unit==='kg')+'">kg</button><button data-u="lb" aria-pressed="'+(S.unit==='lb')+'">lb</button></div>'+
 '<div class="list" style="margin-top:16px"><button class="item" id="chg"><span>Change goal, days or equipment<small>Your logs and progress are kept</small></span>›</button><button class="item" id="exp"><span>Copy my data<small>Backup as text</small></span>›</button><button class="item" id="rst"><span style="color:var(--err)">Reset everything<small>Deletes all logs on this device</small></span>›</button></div>'+
 '<p class="note">'+(docRef?'Synced to your account.':'Saved in this browser.')+' BECOMING YOU ✦ FITNESS gives general fitness guidance, not medical advice.</p><button class="btn g" id="cl" style="margin-top:12px">Close</button>');
 document.querySelectorAll('.sheet [data-u]').forEach(function(b){b.onclick=function(){S.unit=b.dataset.u;save();closeSheet();render()}});
 $('#chg').onclick=function(){closeSheet();ob={i:0,a:Object.assign({},p)};S.profile=null;save();render()};
 $('#exp').onclick=function(){var t=JSON.stringify(S);navigator.clipboard.writeText(t).then(function(){toast('Copied')},function(){toast('Copy blocked')})};
 $('#rst').onclick=function(){sheet('<h2 class="d">Reset everything?</h2><p class="muted" style="margin:10px 0 16px">All workouts, habits and progress will be deleted. This can\'t be undone.</p><button class="btn p" id="y" style="background:var(--err)">Yes, reset</button><button class="btn g" id="n" style="margin-top:8px">Cancel</button>');$('#y').onclick=function(){S=blank();ob={i:0,a:{}};save();closeSheet();render()};$('#n').onclick=closeSheet};
 $('#cl').onclick=closeSheet}
function sheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#modal').classList.add('on');var f=$('#sheet').querySelector('button,input');if(f)setTimeout(function(){f.focus()},50)}
function closeSheet(){$('#modal').classList.remove('on')}
$('#modal').onclick=function(e){if(e.target.id==='modal')closeSheet()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

if(S.cur&&!S.cur.ex){S.cur=null}
render();
})();
</script>
