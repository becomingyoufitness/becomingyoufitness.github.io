@font-face{font-family:Archivo;src:url(fonts/archivo.woff) format('woff');font-weight:600 900;font-stretch:62% 80%;font-display:swap}@font-face{font-family:Inter;src:url(fonts/inter-Regular.woff) format('woff');font-weight:400;font-display:swap}@font-face{font-family:Inter;src:url(fonts/inter-Medium.woff) format('woff');font-weight:500;font-display:swap}@font-face{font-family:Inter;src:url(fonts/inter-SemiBold.woff) format('woff');font-weight:600;font-display:swap}@font-face{font-family:Inter;src:url(fonts/inter-Bold.woff) format('woff');font-weight:700;font-display:swap}
:root{--bg:#0b0b0c;--bg2:#141416;--bg3:#1d1d20;--line:#2a2a2e;--text:#f2efe9;--muted:#a8a29a;--dim:#76716b;--acc:#c9a87a;--acc2:#e3c79c;--ink:#16120c;--ok:#8fb894;--warn:#e0b26a;--err:#e08a7a;--r:14px;
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:400 15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.d{font-family:Archivo,system-ui,sans-serif;font-stretch:72%;font-weight:850;text-transform:uppercase;line-height:.95;letter-spacing:-.005em}
.ey{font:600 .68rem/1 Inter;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.muted{color:var(--muted)}.dim{color:var(--dim)}.acc{color:var(--acc)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(18px + var(--safe-t)) 18px calc(96px + var(--safe-b))}
header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-family:Archivo,system-ui,sans-serif;font-stretch:80%;font-weight:800;letter-spacing:.12em;font-size:.9rem}
.logo i{color:var(--acc);font-style:normal}
.chipbtn{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:.4rem .8rem;font-size:.78rem;color:var(--muted);cursor:pointer}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card.hero{background:radial-gradient(120% 140% at 100% 0%,rgba(201,168,122,.22),transparent 55%),linear-gradient(180deg,#18171a,#121214);border-color:#34302a}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--bg3);border-radius:12px;padding:12px}
.stat b{display:block;font-family:Archivo,system-ui,sans-serif;font-stretch:72%;font-weight:850;font-size:1.6rem;line-height:1}
.stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:52px;border-radius:12px;border:1px solid transparent;font:700 .82rem Inter;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:transform .15s,background .2s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--acc);color:var(--ink)}
.btn.g{background:transparent;border-color:var(--line);color:var(--text)}
.btn.sm{min-height:40px;font-size:.72rem;width:auto;padding:0 14px}
.btn:disabled{opacity:.45}
h1.d{font-size:2.3rem;margin:.4rem 0 .6rem}
h2.d{font-size:1.5rem;margin-bottom:.6rem}
h3{font-size:1rem;font-weight:700}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg3);border-radius:12px;padding:12px 14px;border:1px solid transparent;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--line)}
.item small{display:block;color:var(--muted);font-size:.78rem}
.tag{font:600 .64rem/1 Inter;letter-spacing:.1em;text-transform:uppercase;padding:.35rem .5rem;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.a{color:var(--acc);border-color:rgba(201,168,122,.45)}
.tag.ok{color:var(--ok);border-color:rgba(143,184,148,.45)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(11,11,12,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--safe-b));z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;font-weight:600;letter-spacing:.04em;padding:6px 0;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current=true]{color:var(--acc)}
.opt{display:grid;gap:8px;margin:14px 0}
.opt button{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer}
.opt button b{display:block;font-weight:700}
.opt button small{color:var(--muted)}
.opt button[aria-pressed=true]{border-color:var(--acc);background:rgba(201,168,122,.08)}
.progress{height:4px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:6px 0 22px}
.progress i{display:block;height:100%;background:var(--acc);transition:width .3s}
label.f{display:block;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input.in,select.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:46px}
input.in:focus,select.in:focus{border-color:var(--acc);outline:none}
.set{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.set input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;width:100%;min-height:44px;font-weight:600}
.set input::placeholder{color:#55504a}.set .n{color:var(--dim);font-weight:700;text-align:center}
.chk{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer}
.chk[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#0b0b0c}
.sethead{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;text-align:center}
.hint{font-size:.8rem;border-left:2px solid var(--acc);padding:6px 10px;background:rgba(201,168,122,.06);border-radius:0 8px 8px 0;margin:8px 0 12px;color:#ddd4c6}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));background:var(--acc);color:var(--ink);border-radius:99px;padding:10px 18px;font-weight:800;display:none;gap:12px;align-items:center;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.timer.on{display:flex}
.timer button{background:rgba(0,0,0,.12);border:0;border-radius:99px;padding:4px 10px;font-weight:700;cursor:pointer;color:var(--ink)}
.habit{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.habit:last-child{border:0}
.habit .box{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.habit[aria-checked=true] .box{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.week div{text-align:center;font-size:.68rem;color:var(--dim)}
.week i{display:block;height:34px;border-radius:8px;background:var(--bg3);margin-bottom:4px;position:relative}
.week i.done{background:var(--acc)}
.week i.plan{box-shadow:inset 0 0 0 1.5px var(--acc)}
.week i.today{outline:1.5px solid var(--text);outline-offset:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal.on{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px 18px calc(24px + var(--safe-b))}
.sheet .grab{width:44px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.chart{width:100%;height:160px}
.seg{display:flex;background:var(--bg3);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--text)}
.art p{color:#d6d1c9;margin-bottom:10px}
.art h3{margin:14px 0 6px}
.note{font-size:.76rem;color:var(--dim);margin-top:10px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.toast{position:fixed;top:calc(14px + var(--safe-t));left:50%;transform:translateX(-50%) translateY(-200%);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:.85rem;transition:transform .3s;z-index:50}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.mbar{display:flex;height:6px;border-radius:6px;overflow:hidden;background:var(--bg3);margin-top:14px}
.mbar i{display:block;height:100%}
.mleg{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);margin-top:8px}
.mleg b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mstats div{background:var(--bg3);border-radius:12px;padding:10px 6px;text-align:center}
.mstats b{display:block;font-size:1.1rem}
.mstats span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.steps{padding-left:20px;display:grid;gap:10px;color:#ddd4c6;font-size:.92rem;line-height:1.5}
.steps li::marker{color:var(--acc);font-weight:700}
.dayrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.dayrow button{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 0;color:var(--text);font-weight:700;cursor:pointer}
.dayrow button small{display:block;font-size:.62rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.dayrow button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.dayrow button[aria-pressed=true] small{color:var(--ink)}
.ck .box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;font-size:.8rem}
.ck[aria-pressed=true] .box{background:var(--acc);border-color:var(--acc);color:var(--ink)}
details summary::-webkit-details-marker{color:var(--acc)}
</style>

function macros(items,k){k=k||1;var t={kcal:0,p:0,c:0,f:0};items.forEach(function(x){var i=ING[x[0]],g=x[1]*k/100;t.kcal+=i[1]*g;t.p+=i[2]*g;t.c+=i[3]*g;t.f+=i[4]*g});return{kcal:Math.round(t.kcal),p:Math.round(t.p),c:Math.round(t.c),f:Math.round(t.f)}}

var ARTS=[
 ['Progressive overload, simply','Training',"<p>Your body adapts to what you ask of it. To keep progressing, ask a little more over time: one more rep, a little more weight, better form, or less rest.</p><h3>How this app does it</h3><p>Every exercise has a rep range, like 8–12. When you hit the top of the range on all sets, the app raises the weight next time. If you fall short of the bottom, it keeps or lowers it. You just log honestly.</p>"],
 ['Consistency beats intensity','Mindset',"<p>A plan you follow at 80% for a year beats a perfect plan you quit after three weeks.</p><h3>Make it easy to show up</h3><p>Same days, same time. Clothes ready the night before. On bad days, do the warm-up and the first exercise. Most days that's enough to finish.</p>"],
 ['Restarting after a break','Mindset',"<p>Missing a week is normal. Don't restart from zero and don't try to make up for it.</p><h3>The rule</h3><p>Missed a session? Do the next one. After 2+ weeks off, use about 80% of your last weights for a week, then build back up.</p>"],
 ['Protein without overthinking','Nutrition',"<p>Protein helps you build and keep muscle. A practical target for most people who train is roughly 1.6–2.2 g per kg of bodyweight per day.</p><h3>Easy wins</h3><p>Build each meal around a protein source: eggs, Greek yogurt, chicken, fish, lean meat, tofu, lentils or cottage cheese.</p>"],
 ['Sleep is training','Recovery',"<p>Muscle is built while you recover. Most adults need 7–9 hours.</p><h3>Better sleep</h3><p>Consistent bedtime, dark cool room, screens down 30 minutes before bed, and caffeine before early afternoon.</p>"],
 ['Warm up in 5 minutes','Training',"<p>2 minutes of easy cardio, then 1–2 lighter sets of your first exercise. That's it.</p><h3>Why</h3><p>It raises body temperature, rehearses the movement and lets you check how your body feels before working sets.</p>"],
 ['Pain vs. effort','Safety',"<p>Muscles burning and breathing hard is effort. Sharp, joint or nerve-like pain is not.</p><h3>Rule</h3><p>Stop any exercise that causes sharp pain, chest pain, dizziness or unusual shortness of breath. Persistent pain needs a doctor or physiotherapist, not a harder push.</p>"]

function kg2u(v){return S.unit==='lb'?Math.round(v*2.20462*2)/2:Math.round(v*2)/2}
function u2kg(v){return S.unit==='lb'?v/2.20462:v}
function wk(){var p=S.profile;if(!p)return 1;return Math.floor((Date.now()-p.start)/(7*864e5))+1}
function isDeload(){return wk()%6===0}
function pick(slot,equip,i){var pool=(POOL[slot]||[]).filter(function(id){return EX[id]});var opts=pool.filter(function(id){return EX[id].e.indexOf(equip)>-1});if(!opts.length)opts=pool.filter(function(id){return EX[id].e.indexOf('bw')>-1});if(!opts.length)opts=pool;if(!opts.length)opts=Object.keys(EX).filter(function(id){return EX[id].e.indexOf(equip)>-1});return opts[i%opts.length]}
function scheme(id){var p=S.profile,x=EX[id],big=['squat','hinge','hpush','vpush','hpull','vpull'].indexOf(x.s)>-1;
 var sets=p.level==='new'?(big?3:2):(big?4:3);if(isDeload())sets=Math.max(2,sets-1);
 if(x.t==='t')return{sets:sets,lo:20,hi:45,unit:'s',rest:60};
 var lo,hi;if(p.goal==='strength'&&big&&x.t==='w'){lo=5;hi=8}else if(p.goal==='lose'||p.goal==='fit'){lo=10;hi=15}else{lo=8;hi=12}
 if(x.t==='b'){lo=Math.max(lo,8);hi=Math.max(hi,15)}
 return{sets:sets,lo:lo,hi:hi,unit:'reps',rest:big?120:75}}
function program(){var p=S.profile,t=DAYS[p.days];return t.map(function(d,di){return{name:d[0],ex:d[1].map(function(slot,k){return pick(slot,p.equip,di+k)})}})}
function nextDayIndex(){var n=S.logs.length;return n%S.profile.days}
function todaysPlanned(){return SCHED[S.profile.days].indexOf(new Date().getDay())>-1}
function suggestion(id){var x=EX[id],sc=scheme(id),L=S.last[id];
 if(!L)return{w:null,r:sc.lo,msg:x.t==='w'?'First time: pick a weight you could lift for '+(sc.hi+2)+' clean reps.':'Aim for '+sc.lo+'–'+sc.hi+' '+sc.unit+' with clean form.'};
 var all=L.sets.length&&L.sets.every(function(s){return s.r>=sc.hi}),low=L.sets.some(function(s){return s.r<sc.lo});
 var w=L.w;
 if(x.t==='w'){if(isDeload())return{w:Math.round(w*0.85*2)/2,r:sc.lo,msg:'Deload week: lighter weight, easy reps. Recovery is training too.'};
  if(all){var inc=x.up?2.5:5;if(w<20)inc=x.up?1:2.5;return{w:w+inc,r:sc.lo,msg:'You hit '+sc.hi+' reps on every set last time. Weight goes up: +'+kg2u(inc)+' '+S.unit+'.'}}
  if(low)return{w:w,r:sc.lo,msg:'Last time some sets fell under '+sc.lo+'. Same weight; own it before adding more.'};
  return{w:w,r:Math.min(sc.hi,Math.max.apply(null,L.sets.map(function(s){return s.r}))+1),msg:'Same weight; try to add one rep per set.'}}
 var best=Math.max.apply(null,L.sets.map(function(s){return s.r}));
 if(all)return{w:null,r:sc.hi,msg:'You maxed the range. Make it harder: slower lowering, a pause, or a harder variation.'};
 return{w:null,r:Math.min(sc.hi,best+1),msg:'Beat last time: aim for '+Math.min(sc.hi,best+1)+' '+sc.unit+'.'}}

function startWorkout(di){var d=program()[di];S.cur={di:di,name:d.name,t0:Date.now(),ex:d.ex.map(function(id){var sc=scheme(id),sg=suggestion(id);return{id:id,sets:Array.from({length:sc.sets},function(){return{w:sg.w,r:null,ok:false}})}})};save();render()}
function workout(){
 var c=S.cur;
 var h='<header class="top"><button class="chipbtn" id="quit">✕ End</button><span class="ey">'+esc(c.name)+'</span><span class="dim" id="clock" style="font-size:.85rem"></span></header>';
 h+=c.ex.map(function(e,ei){var x=EX[e.id],sc=scheme(e.id),sg=suggestion(e.id),L=S.last[e.id];
  return '<div class="card"><div class="row between"><div><h3>'+esc(x.n)+'</h3><small class="muted">'+esc(x.m)+' · '+sc.sets+' × '+sc.lo+'–'+sc.hi+' '+sc.unit+' · rest '+sc.rest+'s</small></div><button class="chipbtn" data-info="'+e.id+'">How</button></div>'+
  '<div class="hint">'+esc(sg.msg)+(L?'<br><span class="dim">Last: '+L.sets.map(function(s){return (x.t==='w'?kg2u(L.w)+'×':'')+s.r}).join(', ')+'</span>':'')+'</div>'+
  '<div class="sethead"><span>Set</span><span>'+(x.t==='w'?S.unit:'—')+'</span><span>'+(sc.unit==='s'?'Seconds':'Reps')+'</span><span>✓</span></div>'+
  e.sets.map(function(s,si){return '<div class="set"><span class="n">'+(si+1)+'</span>'+(x.t==='w'?'<input inputmode="decimal" type="number" step="0.5" aria-label="Weight set '+(si+1)+'" data-e="'+ei+'" data-s="'+si+'" data-k="w" value="'+(s.w!=null?kg2u(s.w):'')+'" placeholder="–">':'<span class="dim" style="text-align:center">BW</span>')+
   '<input inputmode="numeric" type="number" aria-label="'+(sc.unit==='s'?'Seconds':'Reps')+' set '+(si+1)+'" data-e="'+ei+'" data-s="'+si+'" data-k="r" value="'+(s.r!=null?s.r:'')+'" placeholder="'+sg.r+'"><button class="chk" aria-label="Complete set '+(si+1)+'" aria-pressed="'+s.ok+'" data-e="'+ei+'" data-s="'+si+'">✓</button></div>'}).join('')+'</div>'}).join('');
 h+='<button class="btn p" id="finishw">Finish workout</button><p class="note" style="text-align:center">Stop any exercise that causes sharp pain, chest pain or dizziness.</p>';
 app.innerHTML=h;
 var tick=function(){var e=$('#clock');if(!e||!S.cur)return;var m=Math.floor((Date.now()-S.cur.t0)/60000);e.textContent=m+' min'};tick();clearInterval(window.__ck);window.__ck=setInterval(tick,30000);
 app.querySelectorAll('.set input').forEach(function(i){i.oninput=function(){var s=S.cur.ex[+i.dataset.e].sets[+i.dataset.s];var v=i.value===''?null:+i.value;if(i.dataset.k==='w')s.w=v==null?null:u2kg(v);else s.r=v;save()}});
 app.querySelectorAll('.chk').forEach(function(b){b.onclick=function(){var e=S.cur.ex[+b.dataset.e],s=e.sets[+b.dataset.s];if(!s.ok&&s.r==null){var sg=suggestion(e.id);s.r=sg.r;}if(!s.ok&&EX[e.id].t==='w'&&!s.w){toast('Enter the weight first');return}s.ok=!s.ok;save();if(s.ok)rest(scheme(e.id).rest);workout()}});

 $('#finishw').onclick=finish;
}
function finish(){var c=S.cur,sum=0,prs=[];var log={d:dayKey(),name:c.name,min:Math.max(1,Math.round((Date.now()-c.t0)/60000)),ex:[]};
 c.ex.forEach(function(e){var done=e.sets.filter(function(s){return s.ok&&s.r});if(!done.length)return;var x=EX[e.id];var w=x.t==='w'?Math.max.apply(null,done.map(function(s){return s.w||0})):0;
  var prev=S.last[e.id],best=(prev&&prev.best)||0,e1=x.t==='w'?Math.max.apply(null,done.map(function(s){return (s.w||0)*(1+s.r/30)})):Math.max.apply(null,done.map(function(s){return s.r}));
  if(prev&&e1>best*1.001)prs.push(x.n);
  S.last[e.id]={w:w,sets:done.map(function(s){return{r:s.r}}),d:log.d,best:Math.max(best,e1)};
  done.forEach(function(s){sum+=(s.w||0)*s.r});log.ex.push({id:e.id,w:w,sets:done.map(function(s){return{w:s.w,r:s.r}})})});
 if(!log.ex.length){toast('No completed sets to save');return}
 log.vol=Math.round(sum);S.logs.push(log);var hb=S.habits[log.d]=S.habits[log.d]||{};hb.train=true;S.cur=null;stopRest();save();tab='today';render();
 sheet('<p class="ey">Session complete</p><h2 class="d" style="margin:.5rem 0">'+esc(log.name)+' ✦ done</h2><div class="grid3" style="margin:14px 0"><div class="stat"><b>'+log.min+'</b><span>Minutes</span></div><div class="stat"><b>'+log.ex.length+'</b><span>Exercises</span></div><div class="stat"><b>'+(log.vol?Math.round(kg2u(log.vol)/100)/10+'k':'—')+'</b><span>'+S.unit+' lifted</span></div></div>'+(prs.length?'<div class="hint">New best: '+prs.map(esc).join(', ')+'</div>':'<p class="muted">Logged. Your next session adjusts automatically from today\'s numbers.</p>')+'<button class="btn p" id="ok" style="margin-top:12px">Done</button>');$('#ok').onclick=closeSheet}

 v.querySelectorAll('#rc button').forEach(function(b){b.onclick=function(){rcat=b.dataset.c;recipeView()}});
 v.querySelectorAll('#rf button').forEach(function(b){b.onclick=function(){rflt[b.dataset.f]=!rflt[b.dataset.f];recipeView()}})}

function grocList(){var agg={},pan={};S.mp.days.forEach(function(d){d.forEach(function(x){var m=MEALS[x.id];m.ing.forEach(function(i){agg[i[0]]=(agg[i[0]]||0)+i[1]*x.k});if(m.pantry)m.pantry.split(',').forEach(function(p){p=p.trim().replace(/\s*\(.*\)/,'');if(p)pan[p.charAt(0).toUpperCase()+p.slice(1)]=1})})});
 var by={};Object.keys(agg).forEach(function(k){var a=ING[k][5];(by[a]=by[a]||[]).push(k)});return{agg:agg,by:by,pan:Object.keys(pan).sort()}}
var AISLES=['Meat & fish','Dairy & eggs','Fruit & veg','Grains & bread','Cans & pantry','Nuts, seeds & extras'];
function grocView(){var v=$('#fv');if(!S.mp){v.innerHTML='<div class="card"><p class="muted" style="margin-bottom:12px">Build your 7-day meal plan first and your grocery list appears here automatically.</p><button class="btn p" id="gp">Build my week</button></div>';$('#gp').onclick=function(){fuelTab='plan';fuel()};return}
 var G=grocList(),n=Object.keys(G.agg).length,done=Object.keys(G.agg).filter(function(k){return S.groc[k]}).length;
 v.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><div><b>'+done+' of '+n+'</b> <span class="dim">items</span></div><span class="tag">7 days</span></div>'+bar(done,n)+'</div>'+
 AISLES.filter(function(a){return G.by[a]}).map(function(a){return '<h3 style="margin:16px 0 8px" class="ey">'+a+'</h3><div class="list">'+G.by[a].map(function(k){var on=!!S.groc[k];return '<button class="item ck" data-k="'+k+'" aria-pressed="'+on+'"><span class="row" style="gap:12px"><span class="box">'+(on?'✓':'')+'</span><span'+(on?' style="text-decoration:line-through;color:var(--dim)"':'')+'>'+esc(ING[k][0])+'</span></span><span class="muted" style="font-size:.85rem;text-align:right">'+fmtG(k,G.agg[k])+'</span></button>'}).join('')+'</div>'}).join('')+
 (G.pan.length?'<h3 style="margin:16px 0 8px" class="ey">Spices & basics</h3><p class="muted" style="font-size:.88rem">'+esc(G.pan.join(', '))+'</p>':'')+
 '<div class="grid2" style="margin-top:16px"><button class="btn g sm" id="sh" style="width:100%">Share list</button><button class="btn g sm" id="cr" style="width:100%">Clear ticks</button></div><p class="note">Amounts are totals for the week, rounded. Buy the nearest pack size; leftovers keep for next week.</p>';
 v.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){var k=b.dataset.k;if(S.groc[k])delete S.groc[k];else S.groc[k]=1;save();grocView()}});
 $('#cr').onclick=function(){S.groc={};save();grocView()};
 $('#sh').onclick=function(){var txt='BECOMING YOU ✦ FITNESS · grocery list\n'+AISLES.filter(function(a){return G.by[a]}).map(function(a){return '\n'+a.toUpperCase()+'\n'+G.by[a].map(function(k){return (S.groc[k]?'✓ ':'• ')+ING[k][0]+' — '+fmtG(k,G.agg[k])}).join('\n')}).join('\n')+(G.pan.length?'\n\nSPICES & BASICS\n'+G.pan.join(', '):'');
  if(navigator.share)navigator.share({title:'Grocery list',text:txt}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){toast('List copied')},function(){toast('Could not copy')});else toast('Sharing not supported')}}

/* =================== LEARN =================== */
function learn(){app.innerHTML=top('Learn')+'<h1 class="d">Know why, not just what.</h1><p class="muted" style="margin-bottom:14px">Short guides. Two minutes each.</p><div class="list">'+ARTS.map(function(a,i){return '<button class="item" data-a="'+i+'"><span>'+esc(a[0])+'<small>2 min read</small></span><span class="tag">'+a[1]+'</span></button>'}).join('')+'</div>';
 app.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){var a=ARTS[+b.dataset.a];sheet('<p class="ey">'+a[1]+'</p><h2 class="d" style="margin:.5rem 0 1rem">'+esc(a[0])+'</h2><div class="art">'+a[2]+'</div><button class="btn g" id="cl" style="margin-top:12px">Close</button>');$('#cl').onclick=closeSheet}})}


/* =================== INSTALL =================== */
var deferredPrompt=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;if(S.profile&&tab==='today'&&!S.cur)render()});
function standalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function installCard(){if(standalone()||S.hideInstall)return '';var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 return '<div class="card" id="inst"><div class="row between"><div><p class="ey">Get the app</p><h3 style="margin-top:6px">Add BECOMING YOU to your home screen</h3></div><button class="chipbtn" id="instx" aria-label="Dismiss">✕</button></div>'+
 (deferredPrompt?'<button class="btn p" id="instb" style="margin-top:12px">Install app</button>':ios?'<p class="muted" style="font-size:.88rem;margin-top:8px">In Safari, tap the <b>Share</b> button, then <b>Add to Home Screen</b>.</p>':'<p class="muted" style="font-size:.88rem;margin-top:8px">Open the browser menu (⋮) and tap <b>Install app</b> or <b>Add to Home screen</b>.</p>')+'</div>'}
function wireInstall(){var b=$('#instb');if(b)b.onclick=function(){deferredPrompt.prompt();deferredPrompt.userChoice.finally(function(){deferredPrompt=null;render()})};var x=$('#instx');if(x)x.onclick=function(){S.hideInstall=true;save();render()}}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){})}

/* =================== SETTINGS & SHEET =================== */
function settings(){var p=S.profile;sheet('<h2 class="d">Settings</h2><label class="f" style="margin-top:14px">Units</label><div class="seg"><button data-u="kg" aria-pressed="'+(S.unit==='kg')+'">kg</button><button data-u="lb" aria-pressed="'+(S.unit==='lb')+'">lb</button></div>'+
 '<div class="list" style="margin-top:16px"><button class="item" id="chg"><span>Change goal, days or equipment<small>Your logs and progress are kept</small></span>›</button><button class="item" id="exp"><span>Copy my data<small>Backup as text</small></span>›</button><button class="item" id="rst"><span style="color:var(--err)">Reset everything<small>Deletes all logs on this device</small></span>›</button></div>'+
 '<p class="note">'+(docRef?'Synced to your account.':'Saved in this browser.')+' BECOMING YOU ✦ FITNESS gives general fitness guidance, not medical advice.</p><button class="btn g" id="cl" style="margin-top:12px">Close</button>');
 document.querySelectorAll('.sheet [data-u]').forEach(function(b){b.onclick=function(){S.unit=b.dataset.u;save();closeSheet();render()}});
 $('#chg').onclick=function(){closeSheet();ob={i:0,a:Object.assign({},p)};S.profile=null;save();render()};
 $('#exp').onclick=function(){var t=JSON.stringify(S);navigator.clipboard.writeText(t).then(function(){toast('Copied')},function(){toast('Copy blocked')})};
 $('#rst').onclick=function(){sheet('<h2 class="d">Reset everything?</h2><p class="muted" style="margin:10px 0 16px">All workouts, habits and progress will be deleted. This can\'t be undone.</p><button class="btn p" id="y" style="background:var(--err)">Yes, reset</button><button class="btn g" id="n" style="margin-top:8px">Cancel</button>');$('#y').onclick=function(){S=blank();ob={i:0,a:{}};save();closeSheet();render()};$('#n').onclick=closeSheet};
 $('#cl').onclick=closeSheet}
function sheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#modal').classList.add('on');var f=$('#sheet').querySelector('button,input');if(f)setTimeout(function(){f.focus()},50)}
function closeSheet(){$('#modal').classList.remove('on')}
$('#modal').onclick=function(e){if(e.target.id==='modal')closeSheet()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

if(S.cur&&!S.cur.ex){S.cur=null}
render();
})();
</script>
